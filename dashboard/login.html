<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sai Vihaar - Attendance Login</title>
<link rel="icon" href="img/logo.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <form id="loginForm" class="card login-box">
    <img src="img/logo.jpg" alt="Sai Vihaar Inn & Suites">
    <div class="hotel-name">Sai Vihaar</div>
    <div class="hotel-sub">Inn &amp; Suites</div>
    <h1>Staff Attendance Login</h1>
    <input type="email" id="email" placeholder="Email" autocomplete="username" required>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" class="primary">Log in</button>
    <p class="error-msg" id="errorMsg"></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
  (async function () {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = "dashboard.html";
  })();

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("errorMsg");
    errorMsg.textContent = "";

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      errorMsg.textContent = error.message;
      return;
    }
    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>

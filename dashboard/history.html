<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance - History</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Attendance</h1>
  <nav>
    <a href="dashboard.html">Live</a>
    <a href="history.html">History</a>
  </nav>
  <button id="logoutBtn">Log out</button>
</header>

<main>
  <div class="card">
    <h2 style="margin-top:0;">History</h2>
    <div class="filters">
      <label>From
        <input type="date" id="fromDate">
      </label>
      <label>To
        <input type="date" id="toDate">
      </label>
      <label>Person
        <select id="personFilter"><option value="">All</option></select>
      </label>
      <button class="primary" id="searchBtn">Search</button>
      <button class="secondary" id="exportBtn">Export CSV</button>
    </div>
    <div id="resultsInfo"></div>
    <table id="resultsTable">
      <thead>
        <tr><th>Time</th><th>Employee No</th><th>Name</th><th>Event</th><th>Verify Mode</th><th>Door</th></tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/history.js"></script>
</body>
</html>

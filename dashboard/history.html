<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sai Vihaar - Attendance History</title>
<link rel="icon" href="img/logo.jpg">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <img src="img/logo.jpg" alt="Sai Vihaar Inn & Suites">
    <div class="brand-text">
      <span class="name">Sai Vihaar</span>
      <span class="sub">Staff Attendance</span>
    </div>
  </div>
  <nav>
    <a href="dashboard.html">Live</a>
    <a href="history.html" class="active">History</a>
  </nav>
  <div class="header-actions">
    <button type="button" class="theme-toggle" aria-label="Toggle theme"></button>
    <button id="logoutBtn">Log out</button>
  </div>
</header>

<main>
  <div class="card">
    <h2>History</h2>

    <div id="peopleChips" class="people-chips"></div>

    <div class="filters">
      <label>From
        <input type="date" id="fromDate">
      </label>
      <label>To
        <input type="date" id="toDate">
      </label>
      <label>Person
        <select id="personFilter"><option value="">All employees</option></select>
      </label>
      <button class="primary" id="searchBtn">Search</button>
      <button class="secondary" id="exportBtn">Export CSV</button>
    </div>

    <div id="personSummary" class="person-summary"></div>
    <div id="timelineWrap"></div>

    <div id="resultsInfo"></div>
    <table id="resultsTable">
      <thead>
        <tr><th>Time</th><th>Employee No</th><th>Name</th><th>Event</th><th>Verify Mode</th><th>Door</th></tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/history.js"></script>
</body>
</html>
